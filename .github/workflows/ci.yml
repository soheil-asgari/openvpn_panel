name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Pytest
        run: pytest --maxfail=1 -q
        env:
          OVPN_PANEL_CONFIG_DIR: ${{ runner.temp }}/ovpn-panel
          OVPN_DATA_DIR: ${{ runner.temp }}/ovpn-panel/data
          OVPN_LOG_DIR: ${{ runner.temp }}/ovpn-panel/log
          OVPN_DATABASE_URL: sqlite:///${{ runner.temp }}/ovpn-panel/ci.sqlite3

  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          ignore_paths: ./scripts/systemd
          # Fail only on real errors; warnings/info stay visible in the log.
          severity: error

  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks — working tree and full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  install-smoke:
    # Best-effort reproducibility check: build the release artifacts from the
    # current commit and syntax-check the injected installer. Full install is
    # verified on real VPS hosts (see docs/TESTING.md).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build installer from the current tree
        env:
          SLUG: ovpn-panel
        run: |
          scripts/release/build-release.sh "v0.0.0-ci"
      - name: shellcheck the generated installer and verification scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -x dist/install.sh
          shellcheck -x scripts/vps-smoke-test.sh scripts/post-reboot-check.sh scripts/tunnel-check.sh
