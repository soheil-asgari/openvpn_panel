      <line x1="96" y1="128" x2="122" y2="161"/>
      <line x1="160" y1="128" x2="134" y2="161"/>
    </g>
  </g>
  <text x="300" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Project Name</text>
  <text x="302" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Self-hosted VPN & tunnel management</text>
  <rect x="302" y="222" width="360" height="6" rx="3" fill="url(#accent)"/>
