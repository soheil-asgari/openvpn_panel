<div class="modal card">
  <h2>{{ t('users.bulk_created') }}</h2>
  <p class="muted">{{ t('users.credentials_note') }}</p>
  <table class="table">
    <thead><tr><th>{{ t('users.username') }}</th><th>{{ t('login.password') }}</th></tr></thead>
    <tbody>
      {% for c in credentials %}
      <tr><td>{{ c.username }}</td><td><code>{{ c.password }}</code></td></tr>
      {% endfor %}
    </tbody>
  </table>
  <p><a class="btn" href="{{ base_path }}/users/export.csv">{{ t('users.export_csv') }}</a>
     <button type="button" class="btn" onclick="document.getElementById('modal').innerHTML=''">{{ t('common.close') }}</button></p>
</div>
