<div class="modal card">
  <h2>{{ t('users.new_password') }}</h2>
  <p>{{ t('users.username') }}: <strong>{{ username }}</strong></p>
  <p>{{ t('login.password') }}: <code>{{ password }}</code></p>
  <p class="muted">{{ t('users.credentials_note') }}</p>
  <div class="modal-actions">
    <button type="button" class="btn" onclick="document.getElementById('modal').innerHTML=''">{{ t('common.close') }}</button>
  </div>
</div>
